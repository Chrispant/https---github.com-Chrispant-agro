<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agro Marketplace</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="page-layout">
    <div id="siteHeader"></div>
      <main class="page-content">
        <div class="container">
          <section class="search-section">
            <h1>Χονδρική αγορά αγροτικών προϊόντων </h1>
            <p class="subtitle">
              Αναζήτηση προϊόντων από όλη την Ελλάδα.
            </p>

<form id="searchForm" class="search-form">
  <div class="form-group">
    <label for="cropType">Καλλιέργεια</label>
    <select id="cropType">
      <option value="">Όλες οι καλλιέργειες</option>
    </select>
  </div>

  <div class="form-group">
    <label for="region">Περιοχή</label>
    <select id="region">
      <option value="">Όλες οι περιοχές</option>
    </select>
  </div>

  <div class="form-group">
    <label>Ποσότητα (τόνοι)</label>
    <div class="range-group">
      <input type="number" id="minQuantity" placeholder="Min" />
      <input type="number" id="maxQuantity" placeholder="Max" />
    </div>
  </div>

  <div class="form-group">
    <label for="harvestMonth">Συγκομιδή</label>
    <input type="month" id="harvestMonth" />
  </div>

  <div class="form-group">
    <label>Τιμή (€ / kg)</label>
    <div class="range-group">
      <input type="number" step="0.01" id="minPrice" placeholder="Min" />
      <input type="number" step="0.01" id="maxPrice" placeholder="Max" />
    </div>
  </div>

  <div class="form-group full-width">
    <button type="submit" class="search-button">Αναζήτηση Αγγελίας</button>
  </div>
</form>
          </section>
        </div>
    </main>

    <div id="siteFooter"></div>

    <script type="module" src="js/layout.js"></script>
    <script type="module" src="js/search.js"></script>
  </body>
</html>
